name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: chezemon-linux-amd64
          - os: macos-14
            artifact: chezemon-darwin-arm64
          - os: windows-latest
            artifact: chezemon-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        shell: bash
        run: go build -trimpath -o "${{ matrix.artifact }}" ./cmd/chezemon
